services:
  - type: web
    name: india-rajasthan-gov-news
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python gov_news_monitor.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        value: "@currentaffair_news"
      - key: POLL_SECONDS
        value: "120"
      - key: NEWS_DB_PATH
        value: gov_news.sqlite3
